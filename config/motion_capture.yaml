/motion_capture_tracking:
  ros__parameters:
    type: optitrack
    hostname: MOTIVE_PC_IP_REQUIRED
    topics:
      frame_id: world
      poses:
        qos:
          mode: sensor
          deadline: 100.0
      tf:
        reference_frame: world
        child_frame_fmt: "%s_mocap"
    marker_configurations:
      default:
        offset: [0.0, 0.0, 0.0]
        points:
          p0: [0.0, 0.0, 0.022]
          p1: [-0.042, 0.042, 0.0]
          p2: [-0.042, -0.042, 0.0]
          p3: [0.042, -0.042, 0.0]
      # Official Crazyswarm2 single-marker geometry; calibrate for the final mount.
      default_single_marker:
        offset: [0.0, -0.01, -0.04]
        points:
          p0: [0.0177184, 0.0139654, 0.0557585]
    dynamics_configurations:
      default:
        max_velocity: [2.0, 2.0, 3.0]
        max_angular_velocity: [20.0, 20.0, 10.0]
        max_roll: 1.4
        max_pitch: 1.4
        max_fitness_score: 0.001
