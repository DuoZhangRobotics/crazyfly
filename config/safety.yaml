crazyfly_safety:
  # This committed configuration can never enable physical flight.
  flight_enabled: false
  timeouts:
    pose_reject_s: 0.100
    pose_land_s: 0.250
    pose_emergency_s: 1.000
    status_stale_s: 2.500
    recovery_s: 1.000
  tracking:
    # A reviewed local hardware profile must set the exact raw marker count.
    expected_raw_marker_count:
    marker_count_grace_s: 0.050
    pose_identity_emergency_s:
    maximum_pose_speed_m_s:
    pose_speed_window_s: 0.050
    pose_speed_action: emergency
  battery:
    warning_v: 3.8
    critical_v: 3.7
  limits:
    maximum_takeoff_height_m: 0.5
    maximum_command_speed_m_s: 0.25
    maximum_trajectory_acceleration_m_s2: 0.5
    maximum_trajectory_jerk_m_s3: 2.0
    maximum_trajectory_duration_s: 60.0
    minimum_separation_m: 0.4
    trajectory_minimum_separation_m: 0.4
    soft_geofence_margin_m: 0.15
  # A local, reviewed configuration must provide min/max before flight.
  geofence: {}
